 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinner Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5dc;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #deb887;
      padding: 1em;
      text-align: center;
    }
    .header h1 {
      margin: 0;
    }
    .search-container {
      margin: 1em auto;
      text-align: center;
    }
    .search-container input {
      padding: 0.5em;
      width: 60%;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #ccc;
      max-width: 400px;
    }
    .search-container button {
      padding: 0.5em 1em;
      font-size: 1em;
      border-radius: 5px;
      background-color: #8b4513;
      color: white;
      border: none;
      cursor: pointer;
      margin-left: 0.5em;
    }
    .dinner-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      padding: 1em;
    }
    .card {
      background-color: #e8e40c;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
      padding: 1em;
      color: #003366;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }
    .card a {
      display: block;
      margin-top: 10px;
      font-size: 18px;
      color: green;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .search-container input {
        width: 80%;
      }
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Search Dinner Recipes</h1>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search for a dinner item...">
    <button onclick="handleSearch()">Search</button>
  </div>

  <div class="dinner-grid" id="dinnerList">
    <div class="card">
      <img src="https://c.ndtvimg.com/2022-09/qro0557o_butter-chicken_625x300_08_September_22.jpg" alt="Butter Chicken" />
      
      <a href=" butterchicken.html"> <h3>Butter Chicken</h3></a>
    </div>
    <div class="card">
      <img src="https://mmmrecipes.com/wp-content/uploads/2024/04/Easy-Egg-Fried-Rice-Recipe.webp" alt="Fried Rice" />
     
      <a href=" fried_rice.html"><h3> Fried Rice</h3></a> 
    </div>
    <div class="card">
      <img src="https://dailydish.co.uk/wp-content/uploads/2021/10/dal-tadka-instagram-1-scaled.jpg" alt="Dal Tadka" />
     
      <a href=" dal_tadka.html"> <h3>Dal Tadka</h3></a>
    </div>
    <div class="card">
      <img src="https://images.immediate.co.uk/production/volatile/sites/30/2020/08/chana-masala-fb809bc.jpg?quality=90&resize=440,400" alt="Chana masala" />
 
      <a href=" chana_masala.html"> <h3>Chana Masala</h3></a> 
    </div>
    <div class="card">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2020/06/palak-paneer-recipe.jpg" alt="Palak Paneer" />
     
      <a href=" palak_paneer.html"> <h3>Palak Paneer</h3></a>
    </div>
    <div class="card">
      <img src="https://www.madhuseverydayindian.com/wp-content/uploads/2020/09/mushroom-curry-mushroom-masala-1024x1024.jpg" alt="Mushroom masala" />
      
      <a href=" mushroom_masala.html"><h3> Mushroom Masala</h3></a>
    </div>
  </div>

  <script>
    function handleSearch() {
      const input = document.getElementById("searchInput").value.trim();
      if (input === "") {
        alert("Please enter a keyword to search.");
        return;
      }
      filterItems(input.toLowerCase());
    }

    function filterItems(query) {
      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        const title = card.querySelector("h3").textContent.toLowerCase();
        card.style.display = title.includes(query) ? "block" : "none";
      });
    }
  </script>

</body>
</html>
