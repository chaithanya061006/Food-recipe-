 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snacks Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff0f5;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #ffb6c1;
      padding: 1em;
      text-align: center;
    }
    .header h1 {
      margin: 0;
    }
    .search-container {
      margin: 1em auto;
      text-align: center;
    }
    .search-container input {
      padding: 0.5em;
      width: 50%;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #fc0b0b;
    }
    .snacks-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
    }
    .card {
      background-color: #a99fa4;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(233, 21, 21, 0.1);
      width: 200px;
      text-align: center;
      padding: 10px;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .search-container input {
        width: 80%;
      }
      .snacks-grid {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Search Snack Recipes</h1>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search for a snack..." onkeyup="filterItems()" />
    <p id="error-message" style="color: red; display: none;">Please enter at least 2 characters!</p>
  </div>

  <div class="snacks-grid" id="snackList">
    <div class="card">
      <img src="https://www.cubesnjuliennes.com/wp-content/uploads/2020/08/Best-Indian-Punjabi-Samosa-Recipe.jpg" alt="Samosa" />
      <a href=" samosa.html">Samosa</a>
    </div>
    <div class="card">
      <img src="https://static.vecteezy.com/system/resources/previews/027/536/411/non_2x/delicious-french-fries-on-a-white-background-photo.jpg" alt="Fries" />
      <a href=" frenchfries.html">French Fries</a>
    </div>
    <div class="card">
      <img src="https://i1.wp.com/modernmealmakeover.com/wp-content/uploads/2020/05/thai-noodles-11-3.jpg?fit=1200,1200&ssl=1" alt="Noodles" />
      <a href=" noodles.html">Noodles</a>
    </div>
   <div class="card">
      <img src="https://www.cubesnjuliennes.com/wp-content/uploads/2018/05/Vegetable-Spring-Roll-recipe.jpg" alt="Spring Rolls" />
      <a href=" springrolls.html">Spring Rolls</a>
    </div>
    <div class="card">
      <img src="https://purendesi.in/wp-content/uploads/2023/03/Vada-Pav-Chutney-600x387.jpg" alt="Vada Pav" />
        <a href=" vadapav.html">Vada Pav</a>

    </div>
    <div class="card">
      <img src="https://img-global.cpcdn.com/recipes/58290099f9d4f97e/1502x1064cq70/pav-bhaji-recipe-recipe-main-photo.jpg" alt="Pav bhaji" />
      <a href=" pavbhaji.html">Pav Bhaji</a>

    </div>
  </div>

  <script>
    function filterItems() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const errorMsg = document.getElementById("error-message");

      if (input.length < 2) {
        errorMsg.style.display = "block";
      } else {
        errorMsg.style.display = "none";
      }

      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        const title = card.querySelector("a").textContent.toLowerCase();
        card.style.display = title.includes(input) ? "block" : "none";
      });
    }
  </script>
</body>
</html>
