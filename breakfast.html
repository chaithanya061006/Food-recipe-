 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Breakfast Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fffaf0;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #ffcc70;
      padding: 1em;
      text-align: center;
    }
    .header h1 {
      margin: 0;
    }
    .search-container {
      margin: 1em auto;
      text-align: center;
    }
    .search-container input {
      padding: 0.5em;
      width: 60%;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #ccc;
      max-width: 400px;
    }
    .search-container button {
      padding: 0.5em 1em;
      font-size: 1em;
      border-radius: 5px;
      background-color: #ff9900;
      color: white;
      border: none;
      cursor: pointer;
    }
    .breakfast-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      padding: 1em;
    }
    .card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
      padding: 1em;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }
    .card a {
      display: block;
      margin-top: 10px;
      font-size: 18px;
      color: green;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .search-container input {
        width: 80%;
      }
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Search Breakfast Recipes</h1>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search for a breakfast item...">
    <button onclick="handleSearch()">Search</button>
  </div>

  <div class="breakfast-grid" id="breakfastList">
    <div class="card">
      <img src="https://indiaforbeginners.com/wp-content/uploads/2020/04/India-for-Beginners-custom-tours-8.jpg" alt="Dosa" />
      <a href="http://127.0.0.1:5500/eoc/html/html/dosa.html">Dosa</a>
    </div>
     <div class="card">
      <img src="https://indiaforbeginners.com/wp-content/uploads/2020/04/India-for-Beginners-custom-tours-8.jpg" alt="Dosa" />
      <a href=>Dosa</a>
    </div>
    <div class="card">
      <img src="https://www.yummytummyaarthi.com/wp-content/uploads/2023/10/ven-pongal-1.jpeg" alt="Pongal" />
      <a href="http://127.0.0.1:5500/eoc/html/html/pongal.html">Pongal</a>
    </div>
    <div class="card">
      <img src="https://lalqilaperth.com.au/wp-content/uploads/2024/05/halwa-puri-1536x670.jpg" alt="Puri" />
      <a href="http://127.0.0.1:5500/eoc/html/html/puri.html">Puri</a>
    </div>
    <div class="card">
      <img src="https://www.ohmyveg.co.uk/wp-content/webp-express/webp-images/uploads/2023/07/Idli-1-scaled-e1722868852202.jpg.webp" alt="Idli" />
      <a href="http://127.0.0.1:5500/eoc/html/html/idli.html">Idli</a>
    </div>
    <div class="card">
      <img src="https://i0.wp.com/aartimadan.com/wp-content/uploads/2020/08/upma-recipe.jpg?w=1000&ssl=1" alt="Upma" />
      <a href="http://127.0.0.1:5500/eoc/html/html/upma.html">Upma</a>
    </div>
    <div class="card">
      <img src="https://i0.wp.com/kalimirchbysmita.com/wp-content/uploads/2016/07/Mysore-Bonda-02.jpg?w=1024&ssl=1" alt="Masore Bonda" />
      <a href="http://127.0.0.1:5500/eoc/html/html/masorebonda.html">Masore Bonda</a>
    </div>
  </div>

  <script>
    function handleSearch() {
      const input = document.getElementById("searchInput").value.trim();
      if (input === "") {
        alert("Please enter a keyword to search.");
        return;
      }
      filterItems(input.toLowerCase());
    }

    function filterItems(query) {
      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        const title = card.querySelector("a").textContent.toLowerCase();
        card.style.display = title.includes(query) ? "block" : "none";
      });
    }
  </script>

</body>
</html>
