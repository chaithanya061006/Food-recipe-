<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dal Tadka Recipe</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fef9f0;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .recipe-container {
    background: #fff;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    padding: 25px 30px;
    box-sizing: border-box;
    text-align: center;
  }
  h1 {
    color: #d68910;
    margin-bottom: 20px;
    font-weight: 700;
  }
  h2 {
    color: #666;
    margin-bottom: 10px;
    font-weight: 600;
    border-bottom: 2px solid #d68910;
    padding-bottom: 5px;
  }
  ul {
    list-style-type: square;
    padding-left: 20px;
    text-align: left;
    margin-bottom: 25px;
    color: #444;
  }
  #stepBox {
    min-height: 120px;
    margin-bottom: 25px;
    font-size: 18px;
    line-height: 1.4;
    color: #874d00;
    border: 2px solid #d68910;
    border-radius: 8px;
    padding: 20px;
    background: #fff6db;
  }
  button {
    background-color: #d68910;
    border: none;
    color: white;
    font-size: 16px;
    font-weight: 600;
    padding: 12px 25px;
    margin: 0 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:disabled {
    background-color: #f3c174;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background-color: #b36e00;
  }
</style>
</head>
<body>

<div class="recipe-container">
  <h1>Dal Tadka Recipe</h1>

  <h2>Ingredients</h2>
  <ul>
    <li>1 cup toor dal (pigeon peas)</li>
    <li>3 cups water</li>
    <li>1 tbsp ghee or oil</li>
    <li>1 tsp cumin seeds</li>
    <li>2 cloves garlic (sliced)</li>
    <li>1 green chili (optional)</li>
    <li>1/2 tsp turmeric powder</li>
    <li>Salt to taste</li>
    <li>Fresh coriander for garnish</li>
  </ul>

  <div id="stepBox">Click "Next" to start cooking!</div>

  <div>
    <button id="prevBtn" onclick="previousStep()" disabled>⬅ Back</button>
    <button id="nextBtn" onclick="nextStep()">Next ➡</button>
  </div>
</div>

<script>
  const steps = [
    "Step 1: Wash dal thoroughly. Pressure cook dal with water, turmeric, and salt until soft.",
    "Step 2: Heat ghee/oil in a pan. Add cumin seeds and let them splutter.",
    "Step 3: Add garlic slices and green chili; sauté until golden brown.",
    "Step 4: Pour this tadka over cooked dal. Mix well and simmer for 5 minutes.",
    "Step 5: Garnish with fresh coriander and serve hot with rice or roti."
  ];

  let current = -1;
  const stepBox = document.getElementById('stepBox');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function updateStep() {
    stepBox.textContent = steps[current];
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === steps.length - 1;
  }

  function nextStep() {
    if (current < steps.length - 1) {
      current++;
      updateStep();
    }
  }

  function previousStep() {
    if (current > 0) {
      current--;
      updateStep();
    }
  }
</script>

</body>
</html>
