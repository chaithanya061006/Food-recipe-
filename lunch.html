 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunch Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0fff0;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #98fb98;
      padding: 1em;
      text-align: center;
    }
    .header h1 {
      margin: 0;
    }

    .search-container {
      margin: 1em auto;
      text-align: center;
      padding: 0 1em;
    }

    form {
      display: inline-block;
      width: 100%;
      max-width: 600px;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.6em;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .lunch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      padding: 1em;
    }

    .card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
      padding: 1em;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card h3 {
      margin: 0.5em 0 0;
    }

    .abc {
      text-decoration: none;
      color: green;
    }

    
    @media (max-width: 768px) {
      .card {
        width: 45%;
      }
    }

    @media (max-width: 500px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Search Lunch Recipes</h1>
  </div>

  <div class="search-container">
    <form onsubmit="return validateSearch()">
      <input type="text" id="searchInput" placeholder="Search for a lunch item..." onkeyup="filterItems()" />
    </form>
  </div>

  <div class="lunch-grid" id="lunchList">
    
    <div class="card">
      <a class="abc" href=" chikenbiryani.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpRqe9AvzEH_HoUg7CkOIE7VE95-ZLvPpzJQ&s" alt="Grilled Chicken" />
        <h3>Grilled Chicken</h3>
      </a>
    </div>

    
    <div class="card">
      <a class="abc" href="vegbiryanirecipie.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwFoNVxfdIbWINbvG25qgwfZwzPY2BwbGfBg&s" alt="Veg Biryani" />
        <h3>Veg Biryani</h3>
      </a>
    </div>

    
    <div class="card">
      <a class="abc" href=" kichidi.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKFBiUzaoEt_v_EgqzFy-5VNvU0cTrJ4OzGQ&s" alt="Quinoa Khichdi" />
        <h3>Quinoa Khichdi</h3>
      </a>
    </div>

    
    <div class="card">
      <a class="abc" href=" biryanirecipe.html">
        <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_366/yldvlbnnda0c2e8ngxlj" alt="Biryani" />
        <h3>Biryani</h3>
      </a>
    </div>

    
    <div class="card">
      <a class="abc" href=" meals.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR41iXwzjEBn-yKvuHxmDcoTj0m74QNV4c0ow&s" alt="Meals" />
        <h3>Meals</h3>
      </a>
    </div>

     
    <div class="card">
      <a class="abc" href=" pulao.html">
        <img src="https://www.sharmispassions.com/wp-content/uploads/2014/07/VegPulao1.jpg" alt="Pulao" />
        <h3>Pulao</h3>
      </a>
    </div>
  </div>

  <script>
    function validateSearch() {
      const input = document.getElementById("searchInput").value.trim();
      if (input === "") {
        alert("Please enter a keyword to search.");
        return false;
      }
      return true;
    }

    function filterItems() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        const title = card.querySelector("h3").textContent.toLowerCase();
        card.style.display = title.includes(input) ? "block" : "none";
      });
    }
  </script>
</body>
</html>
