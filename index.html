<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foodie's Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
  
  body {
    background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  .login-container {
    background-color: rgba(255, 255, 255, 0.9);
    padding: 30px 40px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    max-width: 400px;
    width: 100%;
  }
  
  .login-container h2 {
    margin-bottom: 25px;
    color: #333;
  }
  
  .login-form input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }
  
  .login-form button {
    width: 100%;
    padding: 12px;
    background-color: #ff5e57;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.3s ease;
  }
  
  .login-form button:hover {
    background-color: #e0483e;
  }
  
  .signup-link {
    margin-top: 15px;
    font-size: 14px;
  }
  
  .signup-link a {
    color: #ff5e57;
    text-decoration: none;
  }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Welcome to recipe finder</h2>
    <form class="login-form">
      <input type="text" placeholder="Username or Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p class="signup-link">New here? <a href="htmlsignuppage.html">Sign up</a></p>
    </form>

</body>
</html>
