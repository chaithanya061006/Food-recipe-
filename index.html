 <!DOCTYPE html>
<html>
<head>
  <title>Simple Register/Login</title>
  <style>
    body {
      font-family: Arial;
      background-image: url('https://img.freepik.com/free-photo/top-view-sketchbook-cottage-cheese-with-fresh-ripe-yellow-red-cherries-arranged-around-grey_141793-12013.jpg');
          background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: white;
      padding: 20px;
      text-align: center;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
    #loginBox {
      display: none;
    }
    #error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="box" id="registerBox">
  <h2>Register</h2>
  <input type="text" id="regName" placeholder="Full Name" required>
  <input type="email" id="regEmail" placeholder="Email" required>
  <input type="text" id="regUser" placeholder="Username" required>
  <input type="password" id="regPass" placeholder="Password" required>
  <input type="password" id="regConfirmPass" placeholder="Confirm Password" required>
  <div id="error"></div>
  <button onclick="register()">Register</button>
  <p style="text-align:center; margin-top:10px;">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
</div>

<div class="box" id="loginBox">
  <h2>Login</h2>
  <input type="text" id="loginUser" placeholder="Username" required>
  <input type="password" id="loginPass" placeholder="Password" required>
  <button onclick="login()">Login</button>
  <p style="text-align:center; margin-top:10px;">New user? <a href="#" onclick="showRegister()">Register</a></p>
</div>

<script>
  let user = {};

  function register() {
    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const username = document.getElementById("regUser").value.trim();
    const pass = document.getElementById("regPass").value;
    const confirmPass = document.getElementById("regConfirmPass").value;
    const errorDiv = document.getElementById("error");

    if (!name || !email || !username || !pass || !confirmPass) {
      errorDiv.textContent = "Please fill in all fields.";
      return;
    }

    if (pass !== confirmPass) {
      errorDiv.textContent = "Passwords do not match!";
      return;
    }

    user = { name, email, username, pass };
    localStorage.setItem("registeredUser", JSON.stringify(user));

    alert("Registration successful! Please login.");
    errorDiv.textContent = "";
    showLogin();
  }

  function login() {
    const inputUsername = document.getElementById("loginUser").value.trim();
    const inputPass = document.getElementById("loginPass").value;
    const stored = JSON.parse(localStorage.getItem("registeredUser"));

    if (stored && inputUsername === stored.username && inputPass === stored.pass) {
      localStorage.setItem("user", JSON.stringify(stored));
      alert("Login successful! Redirecting...");
      window.location.href = "1.html";  
    } else {
      alert("Wrong username or password!");
    }
  }

  function showLogin() {
    document.getElementById("registerBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
  }

  function showRegister() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("registerBox").style.display = "block";
  }
</script>

</body>
</html>
